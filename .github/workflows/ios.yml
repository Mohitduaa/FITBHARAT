name: iOS unsigned IPA

# Builds the shared Kotlin framework and the iOS app on a GitHub macOS runner and uploads an unsigned
# FitBharat-unsigned.ipa. Install it on an iPhone with AltStore / Sideloadly, which sign it with your Apple ID.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The Gradle build also configures the Android modules, so an Android SDK must exist. The macOS runner
      # already has one (ANDROID_HOME); only its licences need accepting so Gradle can fetch compileSdk 37.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Install XcodeGen
        run: brew install xcodegen

      # The Android module reads this file at configuration time; the real key is optional.
      - name: Create .env
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then GEMINI_API_KEY="MY_GEMINI_API_KEY"; fi
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env

      # Git on Windows does not keep the executable bit, and Xcode's build phase calls ./gradlew.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build app (unsigned)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project iosApp/FitBharat.xcodeproj \
            -scheme FitBharat \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            GEMINI_API_KEY="${GEMINI_API_KEY:-MY_GEMINI_API_KEY}" \
            2>&1 | tee build/xcodebuild.log

      # Prints only whether the key is there and its length, never the key itself.
      - name: Check Gemini key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then echo "Secret GEMINI_API_KEY: present (${#GEMINI_API_KEY} chars)"; else echo "::warning::Secret GEMINI_API_KEY is empty or missing - the coach will use offline tips"; fi
          IN_APP=$(/usr/libexec/PlistBuddy -c "Print :GEMINI_API_KEY" build/ios/Build/Products/Release-iphoneos/FitBharat.app/Info.plist 2>/dev/null || true)
          if [ "$IN_APP" = "$GEMINI_API_KEY" ] && [ -n "$IN_APP" ]; then echo "Info.plist key: matches the secret"; else echo "::warning::Info.plist key does not match the secret (length ${#IN_APP})"; fi

      - name: Package IPA
        run: |
          APP=build/ios/Build/Products/Release-iphoneos/FitBharat.app
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../FitBharat-unsigned.ipa Payload)
          ls -lh FitBharat-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: FitBharat-unsigned-ipa
          path: FitBharat-unsigned.ipa

      # Second IPA: the same app plus the home screen widget. It needs an App Group, so the bundles are
      # ad-hoc signed with their entitlements for the sideloading tool to pick up. If anything here fails,
      # the plain IPA above is unaffected.
      - name: Build app with widget
        id: widget
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          cd iosApp && xcodegen generate --spec project-widget.yml && cd ..
          xcodebuild \
            -project iosApp/FitBharat.xcodeproj \
            -scheme FitBharat \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-widget \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            GEMINI_API_KEY="${GEMINI_API_KEY:-MY_GEMINI_API_KEY}" \
            2>&1 | tee build/xcodebuild-widget.log
          APP=build/ios-widget/Build/Products/Release-iphoneos/FitBharat.app
          codesign --force --sign - --entitlements iosApp/FitBharatWidget/FitBharatWidget.entitlements "$APP/PlugIns/FitBharatWidget.appex"
          codesign --force --sign - --entitlements iosApp/FitBharat/FitBharat.entitlements "$APP"
          mkdir -p ipa-widget/Payload
          cp -R "$APP" ipa-widget/Payload/
          (cd ipa-widget && zip -qry ../FitBharat-with-widget.ipa Payload)
          ls -lh FitBharat-with-widget.ipa

      - uses: actions/upload-artifact@v4
        if: steps.widget.outcome == 'success'
        with:
          name: FitBharat-with-widget-ipa
          path: FitBharat-with-widget.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build/xcodebuild*.log
          if-no-files-found: ignore
