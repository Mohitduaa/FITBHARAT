# The app plus the home screen widget (the IPA the workflow builds). The widget needs an
# App Group shared with the app; project.yml alone is the app without the widget.
include:
  - project.yml
targets:
  FitBharat:
    entitlements:
      path: FitBharat/FitBharat.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fitbharat.app
    dependencies:
      - target: FitBharatWidget
  FitBharatWidget:
    type: app-extension
    platform: iOS
    sources:
      - FitBharatWidget
    info:
      path: FitBharatWidget/Info.plist
      properties:
        CFBundleDisplayName: FitBharat
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: FitBharatWidget/FitBharatWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fitbharat.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitbharat.app.widget
        PRODUCT_NAME: FitBharatWidget
        SKIP_INSTALL: YES
